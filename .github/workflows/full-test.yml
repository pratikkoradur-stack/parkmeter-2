name: 🧪 Full Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-full-test:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'backend') != false || always()
    
    services:
      mongodb:
        image: mongo:6.0
        ports: [27017:27017]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: 📦 Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: 🧪 Run backend tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/test
        RAZORPAY_KEY_ID: test_key
        RAZORPAY_KEY_SECRET: test_secret

    - name: 🏗️ Test backend build
      run: |
        cd backend
        npm run build || echo "No build script"
        # Verify server starts
        timeout 15s npm start || echo "Server start check completed"

  frontend-full-test:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'frontend') != false || always()
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🎨 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: ⚙️ Setup environment
      run: |
        cd frontend
        echo "REACT_APP_RAZORPAY_KEY_ID=rzp_test_testkey" > .env
        echo "REACT_APP_API_URL=http://localhost:5000" >> .env
        echo "GENERATE_SOURCEMAP=false" >> .env

    - name: 🧪 Run frontend tests
      run: |
        cd frontend
        npm test -- --watchAll=false --coverage

    - name: 🏗️ Build frontend
      run: |
        cd frontend
        npm run build

    - name: 🔍 Verify build output
      run: |
        cd frontend
        test -f build/index.html && echo "✅ index.html exists"
        test -f build/static/js/main.*.js && echo "✅ JavaScript bundles exist"
        test -f build/static/css/main.*.css && echo "✅ CSS bundles exist"
