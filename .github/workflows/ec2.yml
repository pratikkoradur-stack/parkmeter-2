name: Deploy to Ubuntu EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts

      - name: Deploy files via SCP
        run: |
          scp -i ~/.ssh/deploy_key -r ./* ubuntu@${{ secrets.EC2_IP }}:/home/ubuntu/app/

      - name: Install and configure web server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update system packages
            echo "🔄 Updating system packages..."
            sudo apt-get update -y
            
            # Install Apache
            echo "📦 Installing Apache..."
            sudo apt-get install -y apache2
            
            # Create directories
            sudo mkdir -p /var/www/html
            mkdir -p /home/ubuntu/app
            
            # Copy deployed files to web root
            echo "📁 Copying files to web root..."
            sudo cp -r /home/ubuntu/app/* /var/www/html/ 2>/dev/null || true
            
            # Set proper permissions
            echo "🔒 Setting permissions..."
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            sudo find /var/www/html -type f -exec chmod 644 {} \;
            
            # Configure Apache
            echo "⚙️ Configuring Apache..."
            sudo systemctl enable apache2
            sudo systemctl restart apache2
            
            # Check if Apache is running
            if sudo systemctl is-active --quiet apache2; then
              echo "✅ Apache is running successfully!"
              echo "🎉 Deployment completed!"
              echo "🌐 Your website: http://${{ secrets.EC2_IP }}"
            else
              echo "❌ Apache failed to start"
              sudo systemctl status apache2
              exit 1
            fi
