name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to temporary directory
        uses: easingthemes/ssh-deploy@v4
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_IP }}
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          TARGET: /home/ec2-user/app  # ✅ Fixed path
          SOURCE: ./
          EXCLUDE: '.git/, .github/, node_modules/'

      - name: Setup web server and move files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Update and install Apache
            sudo yum update -y
            sudo yum install -y httpd
            
            # Copy files to web root
            sudo cp -r /home/ec2-user/app/* /var/www/html/
            
            # Fix permissions
            sudo chown -R apache:apache /var/www/html
            sudo chmod -R 755 /var/www/html
            
            # Start Apache
            sudo systemctl start httpd
            sudo systemctl enable httpd
            
            echo "✅ Deployment completed successfully!"
