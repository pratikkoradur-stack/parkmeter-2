name: Deploy ParkMeter Backend to EC2 🛠️

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Tests (optional)
        run: echo "No tests yet 😎"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu

            # If project folder does not exist, clone it
            if [ ! -d "parkmeter-server" ]; then
              git clone https://github.com/YOUR_USERNAME/YOUR_REPO.git parkmeter-server
            fi

            cd parkmeter-server

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm install

            # Ensure app listens on 0.0.0.0 in index.js
            # app.listen(3000, "0.0.0.0")

            # Restart or Start PM2
            pm2 restart parkmeter || pm2 start index.js --name parkmeter

            # Save PM2 so it survives reboot
            pm2 save
