name: Auto Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup SSH for EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          
      - name: Copy files to EC2 and deploy
        run: |
          # Copy files to EC2
          rsync -avz -e "ssh -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/parkmeter-2/
          
          # Run deployment on EC2
          ssh -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          echo "🚀 Starting deployment..."
          
          # Go to project
          cd /home/ubuntu/parkmeter-2
          
          # Install dependencies
          npm install
          
          # Build
          npm run build
          
          # Deploy
          sudo mkdir -p /var/www/html
          sudo cp -r dist/* /var/www/html/
          
          # Start server
          cd /var/www/html
          sudo pkill -f "python3 -m http.server" 2>/dev/null || true
          sudo nohup python3 -m http.server 80 > /tmp/web.log 2>&1 &
          
          echo "✅ Website updated!"
          echo "🌐 Visit: http://$(curl -s ifconfig.me)"
          EOF
